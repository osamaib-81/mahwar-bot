<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محور - مساعد البرمجة والفقه الإسلامي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --user-msg: #1d4ed8;
            --bot-msg: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-color);
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #1e293b;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        button {
            padding: 12px 24px;
            margin-right: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>بوت مِحْوَر (Mahwar)</h1>
        <small>خبير البرمجة والفقه الإسلامي</small>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">أهلاً بك! أنا "مِحْوَر"، مساعدك المتخصص في البرمجة والعلوم الشرعية والفقه الإسلامي. كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // تم تضمين المفتاح الجديد الخاص بك هنا مباشرة
    const API_KEY = "AQ.Ab8RN6JMqPJ0n7WSCBMLP9R5X7LBVoPrMC_6NPukGIKe14Ox4w";

    const SYSTEM_INSTRUCTION = "أنت مساعد ذكي اسمك 'محور' متكفّل بتقديم إجابات فائقة الدقة في مجالين أساسيين: 1- البرمجة والتقنية. 2- الفقه الإسلامي والعلوم الشرعية. يجب أن تكون إجاباتك الشرعية مبنية على الأدلة وبأسلوب محترم ومتزن، وإجاباتك البرمجية دقيقة ومعززة بأمثلة كود واضحة.";

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        const messageText = inputElement.value.trim();
        
        if (!messageText) return;

        appendMessage(messageText, 'user-message');
        inputElement.value = '';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `${SYSTEM_INSTRUCTION}\n\nسؤال المستخدم: ${messageText}`
                        }]
                    }]
                })
            });

            const data = await response.json();

            if (data.error) {
                appendMessage(`حدث خطأ من الـ API: ${data.error.message}`, 'bot-message');
            } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                const botReply = data.candidates[0].content.parts[0].text;
                appendMessage(botReply, 'bot-message');
            } else {
                appendMessage("لم يتم استلام رد صريح، يرجى المحاولة لاحقاً.", 'bot-message');
            }
        } catch (error) {
            appendMessage("تعذر الاتصال بالخادم. تحقق من الاتصال بالشبكة.", 'bot-message');
            console.error(error);
        }
    }

    function appendMessage(text, className) {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.textContent = text;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
</script>

</body>
</html>

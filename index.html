<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محور - مساعد الذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #0284c7;
            --user-msg: #0369a1;
            --bot-msg: #334155;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background-color: var(--card-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.6rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 1rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-start;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-end;
            background-color: var(--bot-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .error-message {
            align-self: center;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: #fca5a5;
            font-size: 0.9rem;
            text-align: center;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            padding: 20px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #1e293b;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 14px 28px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0284c7;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>🤖 بوت "محور" الذكي</h1>
        <p>مخصص للبرمجة، العلوم الشرعية، والرد بطلاقة باللغة العربية</p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">أهلاً بك! أنا **محور**، مساعدك الذكي المخصص للبرمجة والعلوم الشرعية. تفضل بطرح سؤالك وسأقوم بالرد عليك فوراً.</div>
    </div>
    
    <div class="chat-input-container">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

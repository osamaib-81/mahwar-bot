<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محور - مساعد الذكاء الاصطناعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            background-color: #0f172a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.user {
            background-color: #0284c7;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #38bdf8;
        }

        .chat-input-area button {
            padding: 12px 24px;
            background-color: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 بوت "محور" الذكي</h1>
            <p>مخصص للبرمجة، العلوم الشرعية، والرد بطاقة باللغة العربية</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                أهلاً بك! أنا **محور**، كيف يمكنني مساعدتك اليوم في البرمجة أو العلوم الشرعية؟
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // إضافة رسالة المستخدم
            addMessage(text, 'user');
            input.value = '';

            // محاكاة رد البوت المؤقت
            setTimeout(() => {
                addMessage("شكراً لتواك! أنا جاهز حالياً لتلقي الأسئلة، ويمكن ربطي بمفتاح API للرد الذكي المباشر.", 'bot');
            }, 600);
        }

        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerText = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>

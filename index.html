<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محور - مساعد الذكاء الاصطناعي</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            width: 100%; 
            max-width: 600px; 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
            text-align: center; 
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; }
        .box { 
            background: #334155; 
            padding: 15px; 
            border-radius: 10px; 
            margin-top: 20px; 
            border: 1px solid #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🤖 بوت "محور" الذكي</h2>
        <p>مخصص للبرمجة، العلوم الشرعية، والرد بطلاقة باللغة العربية ومختلف اللغات الأخرى.</p>
        <div class="box">
            <p>جاهز لربطه بمفتاح التشغيل واستقبال الزوار عبر الرابط العام قريباً!</p>
        </div>
    </div>
</body>
</html>
